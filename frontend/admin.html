<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diáksorsoló</title>
    <link rel="icon" href="img/favicon.ico">
    <link rel="stylesheet" href="css/common.css">

    <script src="js/auth.js?v=2" defer></script>
</head>

<body data-oldal="admin">
    <header id="top-header">
        <div class="container flex-x">
            <img class="logo" alt="Diáksorsoló logó" src="img/logo-sotet.svg">            
            <h1>Diáksorsoló</h1>
        </div>
    </header>
    <div id="top-nav">
        <div class="container flex-x">
            <nav>
                <button class="menu-item">Tanárok</button>
                <button class="menu-item">Osztályok</button>
                <button class="menu-item">Diakok</button>
            </nav>
            <div>
                <img class="icon" src="img/id-card.png" alt="in-card">
                <span id="belepesi-allapot"></span>
                <button class="btn-img" id="kijelentkezes" title="Kijelentkezés"><img class="icon" src="img/close.png" alt="close"></button>
            </div>
        </div>
    </div>

    <main id="vedett-tartalom" hidden>
        <div class="container">
            
            <div class="flex-x">
                <button >Tanárok</button>
                <button >Osztályok</button>
                <button >Diakok</button>

            </div>
        </div>
    </main>

    <footer>
        <p>Diáksorsoló – AFPL I. projekt</p>
    </footer>
</body>
</html>

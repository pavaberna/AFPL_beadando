<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diáksorsoló</title>
    <link rel="icon" href="./img/favicon.ico">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/tanar.css">
    
    <script src="./js/api.js" defer></script>
    <script src="./js/auth.js" defer></script>
</head>

<body data-oldal="tanar">
    <header id="top-header">
        <div class="container flex-x">
            <img class="logo" alt="Diáksorsoló logó" src="img/logo-sotet.svg">            
            <h1>Diáksorsoló</h1>
        </div>
    </header>
    <div id="top-nav">
        <div class="container flex-x">
            <nav>
                <button class="menu-item" id="osztalyok-gomb" data-nezet="osztalyok">Osztályok</button>
            </nav>
            <div>
                <time id="aktualis-datum"></time>
                <details>
                    <summary>  
                        <span id="belepesi-allapot"></span>        
                        <img class="icon" src="img/id-card.png" alt="">
                    </summary>
                    <div class="lenyilo-menu">
                        <button type="button" class="menu-item" id="beallitasok-gomb">
                            Beállítások
                        </button>
                        <button type="button" class="menu-item" data-muvelet="kijelentkezes">
                            Kijelentkezés
                        </button>
                    </div>
                </details>
            </div>
        </div>
    </div>

    <main id="vedett-tartalom" hidden>
        <div class="container">
            <div id="tanar-tartalom">
                Tanári jogosultsággal bejelentkezve
            </div>
        </div>
    </main>

    <footer>
        <p>Diáksorsoló – AFPL I. projekt</p>
    </footer>
</body>
</html>

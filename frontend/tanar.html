<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diáksorsoló</title>
    <link rel="icon" href="./img/favicon.ico">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/tanar.css">
    <link rel="stylesheet" href="./css/szerencsekerek.css">
    <link id="tema-sotet" rel="stylesheet" href="css/tema-sotet.css" media="(prefers-color-scheme: dark)">
    <script src="js/tema.js"></script>  
    <script src="./js/api.js" defer></script>
    <script src="./js/auth.js" defer></script>
</head>

<body data-oldal="tanar">
    <header id="top-header">
        <div class="container flex-x">
            <img class="logo" alt="Diáksorsoló logó" src="img/logo-sotet.svg">            
            <h1>Diáksorsoló</h1>
        </div>
    </header>
    <header id="top-nav">
        <div class="container flex-x">
            <details id="osztaly-menu">
                <summary class="menu-item">Osztályok ▾</summary>
                <div id="osztaly-lista" class="lenyilo-menu"></div>
            </details>
            <details>
                <summary>  
                    <img class="icon" id="teacher-icon" src="img/teacher.png" alt="">
                    <span id="belepesi-allapot"></span>        
                </summary>
                <div class="lenyilo-menu">
                    <button type="button" class="menu-item" id="beallitasok-gomb">
                        Beállítások
                    </button>
                    <button type="button" class="menu-item" data-muvelet="kijelentkezes">
                        Kijelentkezés
                    </button>
                </div>
            </details>
        </header>
    </div>
    <main id="vedett-tartalom" hidden>
        <div class="container grid grid-2">
            <div id="tanar-tartalom">
                Tanári jogosultsággal bejelentkezve
                <time id="aktualis-datum"></time>
            </div>
            <div id="szerencsekerek">
                <p id="kerek-uzenet" role="status">A pörgetéshez válassz osztályt.</p>
                <div id="kerek-tartalom" hidden>
                    <svg viewBox="20 66 360 326" role="img" aria-label="A jelenlévő tanulók szerencsekereke">
                        <g class="kerek-szeletek"></g>
                        <circle class="kerek-perem" cx="200" cy="229" r="153"/>
                        <circle class="kerek-kozep" cx="200" cy="229" r="23"/>
                        <path class="kerek-nyil" d="M332 229 372 207V251Z"/>
                    </svg>
                    <button type="button" id="kerek-porgetes">Pörgetés</button>
                </div>
            </div>

            <dialog id="beallitasok-dialog" aria-labelledby="beallitasok-dialog-cim">
                <h2 id="beallitasok-dialog-cim">Beállítások</h2>

                <form id="beallitasok-urlap" autocomplete="off" novalidate>
                    <p>
                        <label for="beallitasok-nev">Név</label>
                        <input
                            type="text"
                            id="beallitasok-nev"
                            name="display_name"
                            autocomplete="off"
                        >
                    </p>
                    <p>
                        <label for="beallitasok-tema">Megjelenés</label>
                        <select id="beallitasok-tema" name="tema">
                            <option value="default" selected>Alapértelmezett</option>
                            <option value="light">Világos</option>
                            <option value="dark">Sötét</option>
                            <option value="colorful">Színes</option>
                        </select>
                    </p>
                    <p id="beallitasok-hiba" role="alert"></p>

                    <div class="urlap-gombok">
                        <button type="button" id="beallitasok-megse" class="megse">Mégse</button>
                        <button type="submit">Mentés</button>
                    </div>
                </form>
            </dialog>
        </div>
    </main>
    <footer>
        <p>Diáksorsoló – AFPL I. projekt</p>
    </footer>
</body>
</html>

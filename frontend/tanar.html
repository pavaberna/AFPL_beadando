<!DOCTYPE html>
<html lang="hu">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Diáksorsoló</title>
    <link rel="icon" href="./img/favicon.ico">
    <link rel="stylesheet" href="./css/common.css">
    <link rel="stylesheet" href="./css/tanar.css">
    
    <script src="./js/api.js" defer></script>
    <script src="./js/auth.js" defer></script>
</head>

<body data-oldal="tanar">
    <header id="top-header">
        <div class="container flex-x">
            <img class="logo" alt="Diáksorsoló logó" src="img/logo-sotet.svg">            
            <h1>Diáksorsoló</h1>
        </div>
    </header>
    <header id="top-nav">
        <div class="container flex-x">
            <details id="osztaly-menu">
                <summary class="menu-item">Osztályok ▾</summary>
                <div id="osztaly-lista" class="lenyilo-menu"></div>
            </details>
            <details>
                <summary>  
                    <img class="icon" src="img/user.png" alt="">
                    <span id="belepesi-allapot"></span>        
                </summary>
                <div class="lenyilo-menu">
                    <button type="button" class="menu-item" id="beallitasok-gomb">
                        Beállítások
                    </button>
                    <button type="button" class="menu-item" data-muvelet="kijelentkezes">
                        Kijelentkezés
                    </button>
                </div>
            </details>
        </header>
    </div>
    <main id="vedett-tartalom" hidden>
        <div class="container grid grid-2">
            <div id="tanar-tartalom">
                Tanári jogosultsággal bejelentkezve
                <time id="aktualis-datum"></time>
            </div>
            <div id="szerencsekerek">
                <p id="kerek-uzenet" role="status">A pörgetéshez válassz osztályt.</p>
                <div id="kerek-tartalom" hidden>
                    szerencsekerék
                </div>
            </div>
        </div>
    </main>
    <footer>
        <p>Diáksorsoló – AFPL I. projekt</p>
    </footer>
</body>
</html>

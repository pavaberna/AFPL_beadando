name: Build

on:
  push:
  pull_request:

jobs:
  backend:
    name: Backend (lint, formázás, tesztek)
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - name: PHP telepítése
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: pdo_sqlite
          tools: composer:v2

      - name: Composer függőségek gyorsítótára
        uses: actions/cache@v4
        with:
          path: ~/.composer/cache
          key: composer-${{ hashFiles('backend/composer.lock') }}
          restore-keys: composer-

      - name: Függőségek telepítése
        run: composer install --no-interaction --prefer-dist

      - name: Linting (PHPStan statikus kódelemzés)
        run: composer lint

      - name: Formatting (PSR-12 kódformázás ellenőrzése)
        run: composer format

      - name: Tesztek futtatása
        run: composer test

  frontend:
    name: Frontend (JavaScript és JSON ellenőrzés)
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Projekt letöltése
        uses: actions/checkout@v7

      - name: Node.js beállítása
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: JavaScript szintaxis ellenőrzése
        shell: bash
        run: |
          while IFS= read -r -d '' file; do
            echo "Ellenőrzés: $file"
            node --check "$file"
          done < <(find frontend/js -type f -name '*.js' -print0)

      - name: Menü JSON ellenőrzése
        run: |
          node <<'NODE'
          const fs = require("node:fs");
          const file = "frontend/partials/menus.json";

          JSON.parse(fs.readFileSync(file, "utf8"));
          console.log(`${file}: érvényes JSON`);
          NODE
